<title>skynet-backup: privacy policy</title>
<h1>Privacy policy</h1>
<p>skynet-backup is used only by its owner, to store their own encrypted backups in their own Google Drive.
It can see only the files it created there (the drive.file scope). It collects nothing else, shares nothing,
and has no other users.</p>
